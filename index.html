<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Family</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // DARK MODE INITIALIZER: Runs before the page renders to prevent flashing
        tailwind.config = { darkMode: 'class' }
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-300">

    <header class="bg-slate-900 dark:bg-black text-white shadow-lg p-6 md:p-8 sticky top-0 z-50">
        <div class="container mx-auto flex flex-col md:flex-row items-center justify-between">
            <h1 class="text-3xl font-bold tracking-tight mb-4 md:mb-0">The Family</h1>
            <nav class="flex items-center gap-6">
                <ul class="flex items-center space-x-6 font-medium">
                    <li><a href="#about" class="hover:text-amber-400 underline decoration-2 underline-offset-4">About</a></li>
                    <li><a href="#members" class="hover:text-amber-400 underline decoration-2 underline-offset-4">Members</a></li>
                    <li>
                        <a href="pages/game.html" class="flex items-center gap-2 hover:text-amber-400 transition-colors">
                            <i data-lucide="gamepad-2" class="w-5 h-5"></i>
                            Game
                        </a>
                    </li>
                    <li>
                        <a href="pages/draw.html" class="bg-amber-500 px-6 py-2 rounded-xl text-slate-900 font-bold hover:bg-white transition-all shadow-lg shadow-amber-500/20">
                            ✨ Surprise
                        </a>
                    </li>
                </ul>
                <button id="theme-toggle" class="p-2 bg-slate-800 dark:bg-slate-700 rounded-full hover:ring-2 hover:ring-amber-400 transition-all">
                    <i data-lucide="sun" class="hidden dark:block w-5 h-5 text-amber-400"></i>
                    <i data-lucide="moon" class="block dark:hidden w-5 h-5 text-slate-100"></i>
                </button>
            </nav>
        </div>
    </header>

    <main class="container mx-auto py-12 px-4 md:px-8">
        
        <section class="mb-24 text-center">
            <h2 class="text-4xl font-extrabold mb-2 text-slate-900 dark:text-white">Plant a Garden for Mom</h2>
            <p class="text-slate-500 dark:text-slate-400 mb-8">Pick a flower and click in the garden area to plant it!</p>
            
            <div class="flex justify-center gap-6 mb-8 bg-white dark:bg-slate-900 p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 w-fit mx-auto">
                <button onclick="setFlower('🌸')" id="btn-🌸" class="text-5xl hover:scale-110 transition-transform p-2 rounded-xl ring-amber-400">🌸</button>
                <button onclick="setFlower('🌹')" id="btn-🌹" class="text-5xl hover:scale-110 transition-transform p-2 rounded-xl">🌹</button>
                <button onclick="setFlower('🌻')" id="btn-🌻" class="text-5xl hover:scale-110 transition-transform p-2 rounded-xl">🌻</button>
                <button onclick="setFlower('🌷')" id="btn-🌷" class="text-5xl hover:scale-110 transition-transform p-2 rounded-xl">🌷</button>
                <div class="w-px bg-slate-200 dark:bg-slate-700 mx-2"></div>
                <button onclick="clearGarden()" class="text-sm font-bold text-slate-400 hover:text-red-500 transition-colors">Reset</button>
            </div>

            <div id="garden-plot" class="relative w-full max-w-5xl mx-auto h-[450px] bg-emerald-50 dark:bg-emerald-950/20 rounded-[2rem] border-4 border-dashed border-emerald-200 dark:border-emerald-900 cursor-crosshair overflow-hidden shadow-inner">
                <div class="absolute inset-0 flex items-center justify-center opacity-20 pointer-events-none">
                    <p class="text-2xl font-bold text-emerald-800 dark:text-emerald-500 uppercase tracking-widest">Click to Grow</p>
                </div>
            </div>
        </section>

        <section id="about" class="mb-24">
            <div class="bg-white dark:bg-slate-900 rounded-[2rem] shadow-xl p-8 md:p-12 border border-slate-100 dark:border-slate-800 text-center">
                <h2 class="text-4xl font-extrabold mb-6 dark:text-white">Our Family Story</h2>
                <div id="story-box" contenteditable="true" class="story-box text-xl text-slate-600 dark:text-slate-300 max-w-3xl mx-auto p-6 border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-2xl">
                    Click here to write something beautiful...
                </div>
                <div class="mt-6 flex justify-center gap-4">
                    <button id="save-story" class="px-8 py-3 bg-amber-500 text-white rounded-xl shadow-lg">Save Story</button>
                    <button id="clear-story" class="px-8 py-3 bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 rounded-xl">Clear</button>
                </div>
            </div>
        </section>

        <section id="members" class="mb-24">
            <h2 class="text-4xl font-extrabold text-center mb-12 dark:text-white">Meet the Family</h2>
            <div id="members-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8"></div>
        </section>

        <section id="memories" class="mb-24">
            <h2 class="text-4xl font-extrabold text-center mb-12 dark:text-white">Our Memories</h2>
            <div id="memories-container" class="bg-white dark:bg-slate-900 rounded-[2rem] shadow-xl p-8 md:p-12 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 border border-slate-100 dark:border-slate-800"></div>
        </section>
    </main>

    <footer class="bg-slate-900 dark:bg-black text-slate-400 p-12 text-center">
        <p class="text-white font-bold mb-2">Made with ❤️ for the Family</p>
        <p class="text-sm">&copy; <span id="year"></span> All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="js/fam.js"></script>
</body>
</html>
