<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>A Magic Drawing for Mom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-slate-900 flex flex-col items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 md:p-12 rounded-[3rem] shadow-2xl text-center max-w-2xl w-full">
        <canvas id="magicCanvas" width="600" height="400" class="w-full h-auto"></canvas>
        <div id="msg" class="mt-8 transition-all duration-1000 opacity-0 transform translate-y-4">
            <h2 class="text-4xl font-black text-amber-500 mb-2">Marsha Thompson</h2>
            <p class="text-slate-400 font-bold uppercase tracking-widest">The Best Mom in the World</p>
        </div>
    </div>

    <div class="mt-12 flex gap-4">
        <a href="../index.html" class="px-8 py-4 bg-white/10 text-white rounded-2xl font-bold hover:bg-white/20 transition-all">Back to Family</a>
        <button onclick="location.reload()" class="px-8 py-4 bg-amber-500 text-slate-900 rounded-2xl font-bold shadow-lg shadow-amber-500/30">Watch Again</button>
    </div>

    <script>
        const canvas = document.getElementById('magicCanvas');
        const ctx = canvas.getContext('2d');
        let t = 0;

        function drawFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. Draw "The Magic Pen" heart
            ctx.save();
            ctx.translate(300, 200);
            ctx.strokeStyle = "#ef4444";
            ctx.lineWidth = 10;
            ctx.lineCap = "round";
            ctx.beginPath();
            
            for (let i = 0; i <= t; i += 0.02) {
                let x = 16 * Math.pow(Math.sin(i), 3);
                let y = -(13 * Math.cos(i) - 5 * Math.cos(2*i) - 2 * Math.cos(3*i) - Math.cos(4*i));
                ctx.lineTo(x * 12, y * 12);
            }
            ctx.stroke();
            ctx.restore();

            // Continue animation
            if (t < Math.PI * 2) {
                t += 0.04;
                requestAnimationFrame(drawFrame);
            } else {
                // Show text when done
                const msg = document.getElementById('msg');
                msg.classList.remove('opacity-0', 'translate-y-4');
            }
        }

        // Start drawing after a short delay
        setTimeout(drawFrame, 500);
    </script>
</body>
</html>
